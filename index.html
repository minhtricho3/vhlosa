<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Osa — Software Engineer</title>
<meta name="description" content="Trang cá nhân của Osa: dự án, bài viết và thông tin liên hệ." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0e14'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ff9d3d'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<header class="site-header">
  <a href="#home" class="brand">Osa</a>
  <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="navList" aria-label="Mở menu">
    <span></span><span></span><span></span>
  </button>
  <nav class="site-nav" id="navList">
    <a href="#about" data-nav>Giới thiệu</a>
    <a href="#work" data-nav>Dự án</a>
    <a href="#blog" data-nav>Blog</a>
    <a href="#contact" data-nav>Liên hệ</a>
  </nav>
</header>

<div class="trace" aria-hidden="true"><span class="trace-pulse"></span></div>

<main>

  <section id="home" class="section hero">
    <span class="node"></span>
    <img id="avatar" class="avatar" alt="Ảnh đại diện" />
    <div id="avatarFallback" class="avatar avatar-fallback" aria-hidden="true"></div>
    <p class="kicker" id="kicker"></p>
    <h1 id="name"></h1>
    <p class="role" id="role"></p>
    <p class="lede" id="lede"></p>
    <div class="cta-row">
      <a href="#work" class="btn btn-primary">Xem dự án</a>
      <a href="#contact" class="btn btn-ghost">Liên hệ</a>
    </div>
  </section>

  <section id="about" class="section">
    <span class="node"></span>
    <h2>Giới thiệu</h2>
    <div class="about-grid">
      <p class="about-text" id="bio"></p>
      <ul class="skills" id="skills"></ul>
    </div>
  </section>

  <section id="work" class="section">
    <span class="node"></span>
    <h2>Dự án</h2>
    <div class="work-grid" id="workGrid"></div>
  </section>

  <section id="blog" class="section">
    <span class="node"></span>
    <h2>Blog</h2>
    <div class="post-list" id="postList"></div>
  </section>

  <section id="contact" class="section">
    <span class="node"></span>
    <h2>Liên hệ</h2>
    <div class="contact-grid">
      <p class="contact-text" id="contactText"></p>
      <ul class="contact-list" id="contactList"></ul>
    </div>
  </section>

</main>

<footer class="site-footer">
  <p>© <span id="year"></span> Osa. Được xây bằng HTML, CSS và JavaScript thuần.</p>
</footer>

<script src="assets/js/main.js"></script>
</body>
</html>
